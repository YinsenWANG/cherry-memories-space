name: Build macOS arm64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15 # macos-14 已于 2026-11-02 被 GitHub 停用（actions/runner-images#13518）
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select newest Xcode 26 (Swift 6.2)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          echo "Selected $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:mac:arm64
      - name: Verify artifacts and print sizes
        run: |
          ls -l dist/*.dmg dist/*.zip || ls -l dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
