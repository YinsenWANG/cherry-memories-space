name: Build macOS arm64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15 # macos-14 已于 2026-11-02 被 GitHub 停用（actions/runner-images#13518）
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select newest Xcode 26 (Swift 6.2)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          echo "Selected $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version
      - run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm exec dotenv pnpm run build
      - name: Package and sign application
        shell: bash
        run: |
          pnpm exec electron-builder --mac --arm64 --dir
          shopt -s nullglob
          apps=(dist/mac-arm64/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app, found ${#apps[@]}" >&2
            exit 1
          fi
          codesign --force --deep --sign - "${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          pnpm exec electron-builder --mac --arm64 --prepackaged "${apps[0]}"
      - name: Verify app and DMG signatures
        shell: bash
        run: |
          verify_app() {
            local signature
            codesign --verify --deep --strict --verbose=2 "$1"
            signature=$(codesign -dv "$1" 2>&1)
            printf '%s\n' "$signature"
            if grep -q 'linker-signed' <<< "$signature" || ! grep -q 'Signature=adhoc' <<< "$signature"; then
              echo "App does not have a complete ad-hoc bundle signature" >&2
              exit 1
            fi
          }

          shopt -s nullglob
          apps=(dist/mac-arm64/*.app)
          dmgs=(dist/*.dmg)
          zips=(dist/*.zip)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ] || [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one app, DMG, and ZIP" >&2
            exit 1
          fi
          verify_app "${apps[0]}"
          mount_dir=$(mktemp -d "${RUNNER_TEMP}/cherry-dmg-XXXXXX")
          trap 'hdiutil detach "$mount_dir" -quiet || true; rmdir "$mount_dir" || true' EXIT
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -quiet -mountpoint "$mount_dir"
          mounted_apps=("$mount_dir"/*.app)
          if [ "${#mounted_apps[@]}" -ne 1 ]; then
            echo "Expected exactly one app in the DMG" >&2
            exit 1
          fi
          verify_app "${mounted_apps[0]}"
      - name: Verify artifacts and print sizes
        run: |
          ls -l dist/*.dmg dist/*.zip || ls -l dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
